<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body class="site-body">
  {% include header.html %}

  <!-- 왼쪽 광고 배너 (고정) -->
  <aside class="ad-banner" aria-label="광고">
    <a href="https://www.loopers.im/" target="_blank" rel="noopener noreferrer" class="ad-banner__link">
      <div class="ad-banner__badge">AD</div>
      <img class="ad-banner__logo" src="{{ '/img_1.png' | relative_url }}" alt="Loopers" />
      <div class="ad-banner__desc">루프팩 4기<br>모집 예정!</div>
      <span class="ad-banner__cta">방문하기 &rarr;</span>
    </a>
  </aside>

  <main class="site-main">
    {{ content }}
  </main>

  {% include footer.html %}
</body>
</html>
